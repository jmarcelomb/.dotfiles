# Home-level DSH patch layer (~/.dsh/cordis.patch.yml -> this file).
# Applied over EVERY profile (web, dsh-tui, headless, ...) after their own
# layers. Rows here are shared by all surfaces on this machine.
#
# Secrets stay out of this repo: token values are read from the environment
# (sourced from ~/.dsh/mcp-env, which is never committed).
- insert:
    # Cross-session memory, stored locally by Memorix (default ~/.memorix/data,
    # per-project identity from the working directory; non-git folders fall
    # back to the untracked/ project).
    # Upstream: https://github.com/AVIDS2/memorix (pinned 1.3.0, npm global)
    # (--mode micro|lite|team|full selects the tool profile; default micro)
    - id: memory-memorix
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memorix
        transport: stdio
        command: memorix
        args: [serve, --allow-untracked]
        cwd: !!js process.cwd()

    # Context7 docs MCP (ported from ~/.config/opencode/opencode.jsonc)
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
        headers:
          CONTEXT7_API_KEY: !!js process.env.CONTEXT7_API_KEY ?? ''

    # GitHub Copilot MCP (ported from ~/.config/opencode/opencode.jsonc)
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: streamable-http
        url: https://api.githubcopilot.com/mcp/
        headers:
          Authorization: !!js '`Bearer ${process.env.GITHUB_TOKEN ?? ""}`'

