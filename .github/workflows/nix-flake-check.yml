name: Flake Check

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

jobs:
  flake-check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Install statix
      run: nix-env -iA statix -f '<nixpkgs>'

    # Check-only: lint findings FAIL the job instead of being auto-fixed
    # and auto-committed back to the branch (the old mutating behavior
    # raced local work and rewrote branches from CI).
    - name: Statix lint (check only)
      run: statix check .

    - name: Format check (nix fmt + git diff)
      run: |
        nix fmt
        git diff --exit-code

    - name: Nix Flake Check
      run: nix flake check --no-build

    - name: Nix Flake Checker
      uses: DeterminateSystems/flake-checker-action@v12

  build-server:
    # Full native build of the x86_64 server closure. Main only - PRs get
    # the (fast) evaluation gate above. cache.nixos.org substitutes almost
    # everything; this catches breakage that only building reveals.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Build chakra toplevel
      run: nix build .#nixosConfigurations.chakra.config.system.build.toplevel --no-link

    - name: Build caddy toplevel
      run: nix build .#nixosConfigurations.caddy.config.system.build.toplevel --no-link
